[package]
name = "kaset"
version = "0.0.0"
description = "Kaset — pemutar musik pribadi tanpa iklan"
authors = ["Kaset"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "kaset_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Katalog metadata YouTube Music. Client-nya menyimpan connection pool, jadi
# dibuat sekali di AppState, bukan per request.
ytmapi-rs = "0.3"

# Dipakai untuk mengunduh binary yt-dlp saat pertama kali dijalankan, supaya
# pengguna tidak perlu memasang apa pun manual. Fitur TLS-nya bernama "rustls"
# di 0.13 (bukan "rustls-tls"), dan itu sudah diverifikasi lewat `cargo add`.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }

# bundled: SQLite dikompilasi bersama aplikasi, jadi user tidak perlu install apa pun.
# Catatan: butuh C compiler (MSVC di Windows) — sama seperti kebutuhan Rust itu sendiri.
rusqlite = { version = "0.43", features = ["bundled"] }

# Pemrosesan cover playlist upload (DESIGN-LAYOUT §5). Fitur dibatasi ke tiga
# format yang boleh diunggah — default `image` menarik puluhan codec lain
# (TIFF, AVIF, DDS, ...) yang menambah waktu kompilasi tanpa dipakai.
# `jpeg`+`png`+`webp` untuk decode; `jpeg` saja yang dipakai saat encode.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "process", "io-util"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.13"

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[features]
# Default Tauri
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
